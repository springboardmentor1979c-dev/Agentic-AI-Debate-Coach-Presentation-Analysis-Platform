<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Debate Coach</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand fw-bold">
            🎯 AI Debate Coach
        </span>

        <button
            class="btn btn-outline-light btn-sm"
            onclick="window.location.href='dashboard.html'">

            Dashboard

        </button>

    </div>

</nav>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow border-0">

                <div class="card-body p-5">

                    <h1 class="fw-bold text-center mb-2">
                        🗣️ AI Debate
                    </h1>

                    <p class="text-muted text-center mb-4">
                        Present your argument and receive AI-powered feedback.
                    </p>


                    <label class="form-label fw-bold">
                        Select Topic
                    </label>

                    <select
                        id="topic"
                        class="form-select mb-4">

                        <option value="">
                            Choose a topic
                        </option>

                        <option value="Artificial Intelligence">
                            Artificial Intelligence
                        </option>

                        <option value="Online Education">
                            Online Education
                        </option>

                        <option value="Climate Change">
                            Climate Change
                        </option>

                        <option value="Social Media">
                            Social Media
                        </option>

                    </select>


                    <label class="form-label fw-bold">
                        Your Argument
                    </label>

                    <textarea
                        id="argument"
                        class="form-control mb-4"
                        rows="7"
                        placeholder="Write your argument here..."></textarea>


                    <button
                        class="btn btn-primary btn-lg w-100"
                        onclick="submitDebate()">

                        🚀 Analyze My Argument

                    </button>


                    <button
                        class="btn btn-outline-secondary w-100 mt-3"
                        onclick="window.location.href='dashboard.html'">

                        ← Back to Dashboard

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="js/api.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - AI Debate Coach</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Create Account</h1>

        <p class="subtitle">
            Register to use the AI Debate Coach Platform
        </p>


        <input
            type="text"
            id="reg_username"
            placeholder="Username">


        <input
            type="password"
            id="reg_password"
            placeholder="Password">


        <select id="reg_role">

            <option value="">
                Select Role
            </option>

            <option value="Learner">
                Learner
            </option>

            <option value="Coach">
                Coach
            </option>

            <option value="Educator">
                Educator
            </option>

            <option value="Admin">
                Admin
            </option>

        </select>


        <button onclick="registerUser()">

            Register

        </button>


        <p class="bottom-text">

            Already have an account?

            <a href="index.html">
                Login
            </a>

        </p>

    </div>

</div>


<!-- Correct JavaScript file -->
<script src="js/api.js"></script>

</body>

</html>

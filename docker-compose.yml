version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: debate-postgres-db
    restart: always
    environment:
      POSTGRES_DB: debate_coach
      POSTGRES_USER: debate_admin
      POSTGRES_PASSWORD: debate_secure_password_123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debate_admin -d debate_coach"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: debate-backend
    restart: always
    environment:
      - DATABASE_URL=sqlite:////app/data/debate.db
      - DATABASE_PATH=/app/data/debate.db
      - AM_I_IN_A_DOCKER_CONTAINER=true
      - LLM_PROVIDER=mock
      - SECRET_KEY=infosysspringboard
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: debate-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
  backend-data:

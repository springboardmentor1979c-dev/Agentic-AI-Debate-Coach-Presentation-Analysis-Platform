<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Debate Coach</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand fw-bold">
            🎯 AI Debate Coach
        </span>

        <button
            class="btn btn-outline-light btn-sm"
            onclick="window.location.href='dashboard.html'">

            Dashboard

        </button>

    </div>

</nav>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow border-0">

                <div class="card-body p-5">

                    <h1 class="fw-bold text-center mb-2">
                        🗣️ AI Debate
                    </h1>

                    <p class="text-muted text-center mb-4">
                        Present your argument and receive AI-powered feedback.
                    </p>


                    <label class="form-label fw-bold">
                        Select Topic
                    </label>

                    <select
                        id="topic"
                        class="form-select mb-4">

                        <option value="">
                            Choose a topic
                        </option>

                        <option value="Artificial Intelligence">
                            Artificial Intelligence
                        </option>

                        <option value="Online Education">
                            Online Education
                        </option>

                        <option value="Climate Change">
                            Climate Change
                        </option>

                        <option value="Social Media">
                            Social Media
                        </option>

                    </select>


                    <label class="form-label fw-bold">
                        Your Argument
                    </label>

                    <textarea
                        id="argument"
                        class="form-control mb-4"
                        rows="7"
                        placeholder="Write your argument here..."></textarea>


                    <button
                        class="btn btn-primary btn-lg w-100"
                        onclick="submitDebate()">

                        🚀 Analyze My Argument

                    </button>


                    <div id="aiDebateSection" class="mt-4">

                        <button
                            class="btn btn-warning btn-lg w-100"
                            onclick="startAIDebate()">

                            🤖 Challenge Me with AI

                        </button>

                        <div
                            id="aiDebateResult"
                            class="alert alert-info mt-3 d-none">
                        </div>

                    </div>


                    <div id="analysisResult" class="card mt-4 d-none">

                        <div class="card-body">

                            <h4 class="fw-bold mb-3">
                                📊 Performance Analysis
                            </h4>

                            <div class="row g-3">

                                <div class="col-md-6">
                                    <strong>Argument Quality</strong>
                                    <div id="argumentQuality"></div>
                                </div>

                                <div class="col-md-6">
                                    <strong>Evidence Usage</strong>
                                    <div id="evidenceUsage"></div>
                                </div>

                                <div class="col-md-6">
                                    <strong>Logical Consistency</strong>
                                    <div id="logicalConsistency"></div>
                                </div>

                                <div class="col-md-6">
                                    <strong>Rebuttal Effectiveness</strong>
                                    <div id="rebuttalEffectiveness"></div>
                                </div>

                                <div class="col-md-6">
                                    <strong>Communication Skills</strong>
                                    <div id="communicationSkills"></div>
                                </div>

                            </div>

                        </div>

                    </div>


                    <button
                        class="btn btn-outline-secondary w-100 mt-3"
                        onclick="window.location.href='dashboard.html'">

                        ← Back to Dashboard

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

async function startAIDebate() {

    const topic = document.getElementById("topic").value;
    const argument = document.getElementById("argument").value;

    if (!topic || !argument.trim()) {
        alert("Please select a topic and enter your argument.");
        return;
    }

    const resultBox = document.getElementById("aiDebateResult");

    resultBox.classList.remove("d-none");
    resultBox.innerHTML = "🤖 AI is preparing its response...";

    try {

        const token = localStorage.getItem("token");

        const response = await fetch(
            "http://127.0.0.1:8000/ai-debate",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },

                body: JSON.stringify({
                    topic: topic,
                    user_argument: argument
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "AI debate request failed.");
        }

        resultBox.innerHTML = `
            <h5 class="fw-bold">🤖 AI Opponent</h5>

            <p>${data.ai_opponent_response}</p>

            <hr>

            <h6 class="fw-bold">❓ Challenge Question</h6>

            <p>${data.challenge_question}</p>

            <h6 class="fw-bold">💡 Coaching Hint</h6>

            <p>${data.coaching_hint}</p>
        `;

    } catch (error) {

        resultBox.innerHTML =
            "❌ Error: " + error.message;

    }
}

</script>


<script src="js/api.js"></script>

</body>

</html>

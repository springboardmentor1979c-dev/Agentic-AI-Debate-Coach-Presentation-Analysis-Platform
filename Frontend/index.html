<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Debate Coach - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="card">

        <h1>AI Debate Coach</h1>

        <p class="subtitle">
            Login to continue
        </p>

        <input
            type="text"
            id="username"
            placeholder="Username">

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button onclick="loginUser()">
            Login
        </button>

        <p class="bottom-text">
            Don't have an account?

            <a href="register.html">
                Register
            </a>
        </p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>

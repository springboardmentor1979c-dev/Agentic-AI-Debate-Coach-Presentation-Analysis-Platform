<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Debate Coach</title>

    <link href="css/styles.css" rel="stylesheet">

    <style>
        body{
            background:#0d6efd;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            width:420px;
            padding:35px;
            border-radius:15px;
            box-shadow:0 0 25px rgba(0,0,0,.2);
            background:white;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            margin-bottom:20px;
        }

        button{
            width:100%;
        }
    </style>

</head>

<body>

<div class="card">

<h2 class="text-center mb-4">
AI Debate Coach Login
</h2>

<input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<button
class="btn btn-primary w-100"
onclick="loginUser()">

Login

</button>

<br><br>

<p class="text-center">

Don't have an account?

<a href="register.html">

Register

</a>

</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/scripts.js"></script>
<script src="js/api.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Presentation Analysis</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>📊 Presentation Analysis</h1>

        <p class="subtitle">
            Upload your PowerPoint or PDF presentation for AI analysis.
        </p>

        <hr>

        <h3>Select Presentation</h3>

        <input
            type="file"
            id="presentationFile"
            accept=".ppt,.pptx,.pdf">

        <br><br>

        <button
    type="button"
    onclick="uploadPresentation(); return false;">
    
            🚀 Analyze Presentation

        </button>

        <div id="presentationResult" style="display: none; margin-top: 30px;">

            <hr>

            <h2>📊 Presentation Analysis Results</h2>

            <p>
                <strong>Speech Pace:</strong>
                <span id="speechPace"></span> WPM
            </p>

            <p>
                <strong>Filler Words:</strong>
                <span id="fillerWords"></span>
            </p>

            <p>
                <strong>Confidence:</strong>
                <span id="confidenceScore"></span>/100
            </p>

            <p>
                <strong>Clarity:</strong>
                <span id="clarityScore"></span>/100
            </p>

            <p>
                <strong>Audience Engagement:</strong>
                <span id="engagementScore"></span>/100
            </p>

            <h3>
                Overall Score:
                <span id="overallScore"></span>/100
            </h3>

        </div>

        <br>

        <button
            type="button"
            onclick="window.location.href='dashboard.html'">

            ⬅ Back to Dashboard

        </button>

    </div>

</div>

<script src="js/api.js"></script>

</body>
</html>
